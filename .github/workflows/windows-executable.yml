name: Build Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "GroundhogDesktopGUI.py"
      - "groundhog/**"
      - "notebooks/Data/cpt.xlsx"
      - "requirements-desktop.txt"
      - "requirements-build.txt"
      - "build_windows_exe.ps1"
      - ".github/workflows/windows-executable.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Build executable and source bundle
        shell: powershell
        run: .\build_windows_exe.ps1 -Python python

      - name: Upload complete Windows package
        uses: actions/upload-artifact@v4
        with:
          name: GroundhogDesktop-Windows
          path: release/GroundhogDesktop-Windows.zip
          if-no-files-found: error
